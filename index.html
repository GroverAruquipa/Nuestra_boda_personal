<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notre mariage</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notre mariage">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Pinyon+Script&family=Caveat:wght@500;700&family=Karla:wght@400;500;600;700&display=swap">
<style>
/* Layout: romantic hero (names in script, an arc joining the two cities with a heart travelling along it, two live clocks, countdown),
   then a sticky tab bar over six panels: Home, Tasks, Guests, Vendors, Ideas, The day. */
:root{
  --bg:#f7f1f4; --paper:#fffbfd; --ink:#2b1a2e; --muted:#7a6577; --line:#eadde5;
  --rose:#cf4f74; --rose-soft:#fbe4ec; --sage:#4f7f69; --sage-soft:#e1eee7; --gold:#a87a26; --gold-soft:#f6ecd6;
  --shadow:0 1px 2px rgba(60,20,50,.06),0 8px 24px rgba(60,20,50,.06);
  --on-photo:#ffffff; --blush:#ffc9da; --polaroid:#fffdfb; --polaroid-ink:#4a2f45;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --script:"Pinyon Script", "Snell Roundhand", cursive;
  --body:"Karla", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1119; --paper:#241823; --ink:#f5eaf1; --muted:#b5a0b1; --line:#3b2a39;
  --rose:#f28aa7; --rose-soft:#3f1f2d; --sage:#8fc6aa; --sage-soft:#1f3329; --gold:#e3ba68; --gold-soft:#3a2d17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1119; --paper:#241823; --ink:#f5eaf1; --muted:#b5a0b1; --line:#3b2a39;
  --rose:#f28aa7; --rose-soft:#3f1f2d; --sage:#8fc6aa; --sage-soft:#1f3329; --gold:#e3ba68; --gold-soft:#3a2d17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-block:14px 0;position:relative;z-index:2}
.chip{color:var(--ink);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.btn:hover{border-color:var(--rose)}
.sync{color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
.sync.warn i{background:var(--gold)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding-bottom:28px}
.cover{position:relative;min-height:clamp(400px,66vh,640px);display:flex;overflow:hidden;color:var(--on-photo)}
.slides,.slide,.shade{position:absolute;inset:0}
.slide{background-size:cover;background-position:center 55%;opacity:0;transition:opacity 2.2s ease}
.slide.on{opacity:1;animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1.02)}}
.shade{background:linear-gradient(180deg,rgba(28,12,40,.42) 0%,rgba(28,12,40,.12) 38%,rgba(28,12,40,.18) 62%,var(--bg) 100%)}
#petals{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.cover-in{position:relative;z-index:2;display:flex;flex-direction:column;width:100%;padding-bottom:70px}
.cover-text{margin:auto 0;text-align:center;padding-top:20px}
.cover .kicker{color:var(--on-photo);opacity:.9;text-shadow:0 1px 10px rgba(30,10,40,.5)}
.cover .names{color:var(--on-photo);text-shadow:0 2px 30px rgba(30,10,40,.55),0 1px 3px rgba(30,10,40,.3)}
.cover .names .amp{color:var(--blush)}
.cover .when{color:var(--on-photo);opacity:.95;text-shadow:0 1px 12px rgba(30,10,40,.6)}
.hero-in{position:relative;z-index:1;text-align:center}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:22px}
.names{font-family:var(--script);font-weight:400;font-size:clamp(56px,12vw,120px);line-height:1.05;margin:6px 0 0;color:var(--ink);text-wrap:balance}
.names .amp{color:var(--rose);font-size:.8em;padding-inline:.12em}
.when{font-family:var(--display);font-size:clamp(17px,2.8vw,22px);color:var(--muted);margin-top:4px}

/* editable text */
.ed{border-radius:6px;padding:1px 4px;margin:-1px -4px;cursor:text;transition:background .15s,box-shadow .15s;outline:none;min-width:2ch;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.ed:hover{background:color-mix(in srgb,var(--rose) 9%,transparent)}
.ed:focus{background:var(--paper);box-shadow:0 0 0 2px var(--rose)}
.ed:empty::before{content:attr(data-ph);color:var(--muted);opacity:.8}
.blockEd{display:block}
/* notes */
.keep{margin:6px 0 30px}
.keep .head{align-items:center}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);animation:fade .35s ease;min-width:0}
.note:nth-child(4n+2){background:color-mix(in srgb,var(--rose-soft) 55%,var(--paper))}
.note:nth-child(4n+3){background:color-mix(in srgb,var(--sage-soft) 60%,var(--paper))}
.note:nth-child(4n+4){background:color-mix(in srgb,var(--gold-soft) 55%,var(--paper))}
.note .nt{display:flex;align-items:flex-start;gap:6px}
.note .nt .ed{font-family:var(--display);font-size:19px;line-height:1.25;flex:1}
.note .nb{white-space:pre-wrap;font-size:15px;line-height:1.55;min-height:3em}
.note .nm2{font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}
/* priorities */
.prio{margin:6px 0 30px}
.prio .head{align-items:center}
.plist{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);animation:fade .3s ease}
.plist li:last-child{border-bottom:0}
.plist .rank{border:0;padding:0;width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:var(--rose-soft);color:var(--rose)}
.plist li.done .rank{background:var(--sage-soft);color:var(--sage)}
.plist li.done .ptx{color:var(--muted);text-decoration:line-through}
.plist .ptx{flex:1;min-width:0}
.plist .mvb{display:flex;gap:2px}
.plist .mvb button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:30px;height:28px;padding:0;color:var(--muted)}
.plist .mvb button:hover{color:var(--ink);border-color:var(--rose)}
.plist .mvb button:disabled{opacity:.3;cursor:default}
/* mind map */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-6px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-idea{background:var(--gold)}.d-q{background:var(--rose)}.d-ok{background:var(--sage)}
.mm{position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;border-radius:24px;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--rose-soft) 70%,transparent) 0%,transparent 70%);margin-bottom:18px}
.mm svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mm svg path{fill:none;stroke:color-mix(in srgb,var(--rose) 35%,var(--line));stroke-width:1.6;stroke-linecap:round}
.mm svg.anim path{stroke-dasharray:700;animation:drawl 1.1s cubic-bezier(.3,.7,.2,1) both}
.mm svg path.on{stroke:var(--rose);stroke-width:2.6}
@keyframes drawl{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.mmc{flex:1 0 100%;text-align:center;font-family:var(--script);font-size:46px;line-height:1;color:var(--rose);padding:8px 0 10px}
.pill{position:relative;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px 8px;font-size:14.5px;font-weight:500;display:inline-flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);transition:border-color .2s,background .2s,transform .2s}
.pill:hover{border-color:var(--rose)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill .dots{display:flex;gap:3px}
.pill .dots i{width:6px;height:6px;border-radius:50%;display:block}
.mm.anim .pill{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{from{opacity:.01;transform:var(--tf,none) scale(.6)}to{opacity:1;transform:var(--tf,none) scale(1)}}
.mm.wide{display:block;padding:0}
.mm.wide .mmc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 30px 22px;background:var(--paper);border:2px solid var(--rose);border-radius:46% 54% 50% 50% / 55% 45% 55% 45%;box-shadow:0 10px 30px color-mix(in srgb,var(--rose) 22%,transparent);flex:none;white-space:nowrap;z-index:2}
.mm.wide .pill{position:absolute;--tf:translate(-50%,-50%);transform:translate(-50%,-50%);white-space:nowrap;z-index:2}
.mm.wide .pill:hover{transform:translate(-50%,-50%) scale(1.05)}
.bcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);animation:fade .3s ease}
.bcard .bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bcard .bh .ed{font-family:var(--display);font-size:24px;flex:1;min-width:0}
.ilist{list-style:none;margin:0 0 12px;padding:0}
.ilist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ilist li .itx{flex:1;min-width:0}
.stb{border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.stb.s-idea{background:var(--gold-soft);color:var(--gold)}.stb.s-q{background:var(--rose-soft);color:var(--rose)}.stb.s-ok{background:var(--sage-soft);color:var(--sage)}
.bcard form{display:flex;gap:8px;flex-wrap:wrap}
.bcard form input{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 11px}
.danger2{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:8px}
.danger2:hover,.danger2.arm{color:var(--rose);background:var(--rose-soft)}
/* drawn idea map (like the paper) */
:root{--lav:#dcc3ec;--lav-2:#cfb0e3;--lav-ink:#38295c;--lav-line:rgba(56,41,92,.55);--lav-pink:#c9408a;--hand:"Caveat","Segoe Print","Bradley Hand",cursive}
.btools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;min-height:38px}
.btools button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:13.5px}
.btools button:hover{border-color:var(--rose)}
.btools button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btools button.arm{background:var(--rose-soft);color:var(--rose);border-color:var(--rose)}
.btools .sep{flex:1}
.btools .selname{font-family:var(--hand);font-size:22px;line-height:1;color:var(--ink);padding:0 6px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bview{position:relative;height:min(68vh,660px);overflow:auto;border-radius:18px;box-shadow:0 2px 6px rgba(40,10,60,.12),0 18px 40px rgba(40,10,60,.16);background:var(--lav);overscroll-behavior:contain;cursor:grab}
.bview.panning{cursor:grabbing}
.bsize{position:relative}
.paper{position:absolute;left:0;top:0;width:1900px;height:1320px;transform-origin:0 0;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.1),transparent 40%),radial-gradient(circle at 80% 70%,rgba(120,60,160,.06),transparent 45%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px),var(--lav);color:var(--lav-ink);font-family:var(--hand)}
.paper svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.paper svg path{fill:none;stroke:var(--lav-line);stroke-width:1.7;stroke-linecap:round}
.paper svg path.l1{stroke-width:2.2}
.paper svg.anim path{stroke-dasharray:500;animation:drawl 1.2s ease both}
.pc{position:absolute;transform:translate(-50%,-50%);font-family:var(--hand);font-weight:700;font-size:54px;color:var(--lav-pink);padding:10px 34px 14px;border:2.5px solid var(--lav-pink);border-radius:44% 56% 52% 48% / 58% 44% 56% 42%;background:rgba(255,255,255,.22);white-space:nowrap;user-select:none;z-index:3}
.pn{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;line-height:1.05;padding:3px 8px;border-radius:12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;z-index:2;display:flex;align-items:center;gap:6px;transition:background .15s,box-shadow .15s}
.pn.a-l{transform:translate(0,-50%)}.pn.a-r{transform:translate(-100%,-50%);flex-direction:row-reverse}
.pn:hover{background:rgba(255,255,255,.28)}
.pn.dragging{cursor:grabbing;background:rgba(255,255,255,.45);box-shadow:0 8px 20px rgba(56,41,92,.25);z-index:5}
.pn.sel{background:rgba(255,255,255,.55);box-shadow:0 0 0 2px var(--lav-pink);z-index:4}
.pn.pb{font-size:30px;font-weight:700}
.pn.pi{font-size:21px;font-weight:500}
.pn.pi.s-q{color:#a02c6c}
.pn.pi.s-ok{color:#2f6b55}
.pn .dot{width:8px;height:8px}
.pn .pt{outline:none;min-width:1ch}
.pn .pt[contenteditable="true"],.pn .pt[contenteditable="plaintext-only"]{user-select:text;-webkit-user-select:text;cursor:text;background:#fff;color:var(--lav-ink);border-radius:6px;padding:0 4px}
.paper.anim .pn,.paper.anim .pc{animation:pfade .7s ease both}
@keyframes pfade{from{opacity:.01}to{opacity:1}}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
.ilist li .indent{display:inline-block;flex:none}
/* story: polaroids */
.story{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(20px,4vw,48px);align-items:center;margin-bottom:34px}
.story .kicker{margin-top:0}
.story h2{font-family:var(--script);font-size:clamp(52px,8vw,78px);line-height:1;color:var(--rose);margin:4px 0 10px}
.story p{color:var(--muted);max-width:40ch;margin:0;font-size:16px}
.pols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto auto;gap:16px;padding:8px}
.pol{margin:0;background:var(--polaroid);padding:9px 9px 36px;border-radius:3px;box-shadow:0 2px 6px rgba(40,10,40,.12),0 14px 34px rgba(40,10,40,.16);transform:rotate(var(--r,0deg));transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s;cursor:zoom-in;position:relative;border:0;font:inherit;text-align:left;animation:drop .9s cubic-bezier(.2,.7,.2,1) both}
.pol:hover,.pol:focus-visible{transform:rotate(0deg) scale(1.03);z-index:2;box-shadow:0 4px 10px rgba(40,10,40,.15),0 24px 50px rgba(40,10,40,.22)}
.pol img{display:block;width:100%;height:100%;object-fit:cover;border-radius:1px}
.pol .ph{display:block;overflow:hidden;aspect-ratio:var(--ar,4/3)}
.pol .cap{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--script);font-size:24px;line-height:1;color:var(--polaroid-ink)}
.pol.p1{grid-row:1/3;--ar:2/3;--r:-2.5deg;align-self:center}
.pol.p2{--r:2deg;animation-delay:.15s}
.pol.p3{--r:-1.5deg;animation-delay:.3s}
.pol.p3 img{object-position:center 78%}
@keyframes drop{from{opacity:.01;transform:translateY(18px) rotate(calc(var(--r,0deg) * 3))}to{opacity:1;transform:rotate(var(--r,0deg))}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(18,8,22,.92);display:grid;place-items:center;padding:16px;animation:fade .25s ease}
.lb img{max-width:min(1100px,100%);max-height:calc(100% - 80px);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fade .3s ease}
.lb .lbc{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-family:var(--script);font-size:30px}
.lb button{position:absolute;z-index:2;border:1px solid rgba(255,255,255,.35);background:rgba(20,8,24,.55);color:#fff;width:46px;height:46px;border-radius:50%;font-size:24px;line-height:1;display:grid;place-items:center}
.lb button:hover{background:rgba(255,255,255,.28)}
.lb .lbx{top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.lb .lbp{left:14px;top:50%;transform:translateY(-50%)}
.lb .lbn{right:14px;top:50%;transform:translateY(-50%)}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.2s}.d3{animation-delay:.34s}.d4{animation-delay:.5s}
@keyframes rise{from{opacity:.01;transform:translateY(14px)}to{opacity:1;transform:none}}

.bridge{display:grid;grid-template-columns:1fr minmax(0,2.2fr) 1fr;align-items:end;gap:8px;margin-top:22px}
.arcbox{position:relative;min-width:0}
.arc{width:100%;height:auto;display:block;overflow:visible}
.arc .base{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round}
.arc .draw{fill:none;stroke:var(--rose);stroke-width:2.2;stroke-linecap:round;opacity:.75}
.arc .end{fill:var(--paper);stroke:var(--rose);stroke-width:2.5}
.arc .pulse{fill:none;stroke:var(--rose);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.arc .pulse.b{animation-delay:1.2s}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
.arc #heart path{fill:var(--rose)}
.clock{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.clock .who{font-weight:600;font-size:14px}
.clock .city{font-size:12px;color:var(--muted);letter-spacing:.04em}
.clock .time{font-family:var(--display);font-size:clamp(26px,4.4vw,38px);line-height:1.1;font-variant-numeric:tabular-nums}
.clock .state{font-size:12px;color:var(--muted)}
.clock .state b{font-weight:600;color:var(--sage)}
.clock .state b.night{color:var(--gold)}
.tzdiff{font-size:12.5px;color:var(--muted);margin-top:2px}

.count{display:flex;justify-content:center;gap:clamp(10px,3vw,28px);margin-top:22px;flex-wrap:wrap}
.cu{display:flex;flex-direction:column;align-items:center;min-width:64px}
.cu b{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,54px);line-height:1;font-variant-numeric:tabular-nums}
.cu span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.cu.main b{color:var(--rose)}
.cu b.tick{animation:tick .45s ease}
@keyframes tick{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}

.hugrow{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:4px;flex-wrap:wrap}
.hug{position:relative;border:0;background:var(--rose);color:var(--paper);border-radius:999px;padding:11px 22px;font-weight:600;font-size:15px;box-shadow:0 6px 18px color-mix(in srgb,var(--rose) 35%,transparent);transition:transform .15s}
.hug:hover{transform:translateY(-1px)}
.hug:active{transform:scale(.97)}
.huginfo{font-size:13px;color:var(--muted);flex-basis:100%;text-align:center}
.pres{flex-basis:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.pres:empty{display:none}
.pduo{display:flex;align-items:center;gap:6px}
.pduo .pp{position:relative;display:inline-flex;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.pduo .pp .av{width:38px;height:38px;font-size:15px;border-width:3px}
.pduo .pp i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.pduo .pp.on i{background:#3fbf73;box-shadow:0 0 0 0 rgba(63,191,115,.6);animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(63,191,115,.55)}100%{box-shadow:0 0 0 10px rgba(63,191,115,0)}}
.pduo .ph{color:var(--line);font-size:20px;transition:color .4s,transform .4s}
.pduo.both .ph{color:var(--rose);animation:beat 1.3s ease-in-out infinite}
.pduo.both .pp:first-child{transform:translateX(6px)}.pduo.both .pp:last-child{transform:translateX(-6px)}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.ptxt{font-size:13.5px;color:var(--muted)}
.ptxt b{color:var(--rose);font-weight:600}
.hugov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .3s ease;cursor:pointer}
.hugov .hc{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px}
.hugov svg{width:150px;height:150px;fill:var(--rose);filter:drop-shadow(0 12px 30px color-mix(in srgb,var(--rose) 45%,transparent));animation:beat 1.2s ease-in-out infinite}
.hugov .ht{font-family:var(--script);font-size:clamp(40px,10vw,60px);color:var(--rose);line-height:1.05}
.hugov .hs{color:var(--muted);font-size:14px}
.float{position:fixed;pointer-events:none;z-index:60;color:var(--rose);font-size:22px;animation:floatup 1.6s ease-out forwards}
@keyframes floatup{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),-140px) scale(1.2);opacity:0}}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{border:0;background:none;border-radius:999px;padding:7px 14px;white-space:nowrap;color:var(--muted);font-weight:500;position:relative}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .badge{display:inline-block;min-width:18px;font-size:11px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--rose-soft);color:var(--rose);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .badge{background:var(--rose);color:var(--paper)}

main{padding-block:26px 80px}
/* phone app: bottom navigation */
.bnav{display:none}
.more{position:fixed;inset:0;z-index:55;background:rgba(20,8,18,.4);display:flex;align-items:flex-end;animation:fade .2s ease}
.more .msheet{width:100%;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 16px calc(84px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:4px}
.more .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.more button{display:flex;align-items:center;gap:14px;border:0;background:none;padding:13px 10px;border-radius:12px;font-size:16px;text-align:left;color:var(--ink)}
.more button:hover,.more button[aria-current="true"]{background:var(--rose-soft)}
.more svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.more .mnote{font-size:13.5px;color:var(--muted);padding:4px 10px 8px;line-height:1.45}
@media (max-width:760px){
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;font-size:11px;font-weight:600;color:var(--muted);min-height:52px}
  .bnav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
  .bnav button[aria-current="true"]{color:var(--rose)}
  .bnav button[aria-current="true"] svg{transform:translateY(-1px) scale(1.08)}
  main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
  footer.footph{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .cover{min-height:clamp(320px,52vh,440px)}
  .top #langBtn,.top #setBtn{display:none}
  body:not(.t-home) .hero,body:not(.t-home) footer{display:none}
  body:not(.t-home) main{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .bview{height:calc(100dvh - 300px);min-height:380px}
  .btools button{padding:8px 13px;font-size:14px}
  .task{padding-block:12px}
  .chk{width:30px;height:30px}
  .x{font-size:22px;padding:4px 8px}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}
.panel{animation:fade .45s ease}
@keyframes fade{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.sub{color:var(--muted);margin:4px 0 18px;max-width:62ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}

/* forms */
.add{display:flex;gap:8px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:18px}
.add input,.add select,.add textarea,.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 11px;min-width:0}
.add input[type=text],.add textarea{flex:1 1 220px}
.add input[type=number]{width:76px}
.add input[type=time]{width:120px}
.primary{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 16px;font-weight:600}
.primary:hover{background:var(--rose)}
.ghost{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 14px}
.ghost:hover{border-color:var(--rose)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.f{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* avatars */
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:700;color:var(--paper);flex:none;border:2px solid var(--paper)}
.av-a{background:var(--sage)}.av-b{background:var(--rose)}
.pair{display:inline-flex}.pair .av+.av{margin-left:-8px}
.whob{border:0;background:none;padding:2px;border-radius:999px;display:inline-flex}
.whob:hover{background:var(--line)}

/* ---------- home ---------- */
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed var(--rose);background:var(--rose-soft);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.banner p{margin:0;flex:1 1 260px}
.banner.gold{border-color:var(--gold);background:var(--gold-soft)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .big{font-family:var(--display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .big small{font-size:16px;color:var(--muted)}
.stat .note{font-size:13px;color:var(--muted)}
.ringstat{flex-direction:row;align-items:center;gap:14px}
.ring{width:76px;height:76px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--rose);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font-family:var(--display);font-size:20px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--sage);border-radius:3px;transition:width .8s ease}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;margin-top:26px}
.box h3{margin-bottom:8px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li .tm{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:12px 0}

/* ---------- tasks ---------- */
.group{margin-bottom:22px}
.ghead{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.ghead h3{flex:1}
.ghead .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghead .mini{width:80px;margin:0}
.task{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);transition:background .2s}
.task:hover{background:color-mix(in srgb,var(--paper) 70%,transparent)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;padding:0;flex:none;transition:all .2s}
.chk svg{width:16px;height:16px}
.chk path{fill:none;stroke:var(--paper);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s ease .05s}
.chk[aria-pressed="true"]{background:var(--sage);border-color:var(--sage)}
.chk[aria-pressed="true"] path{stroke-dashoffset:0}
.chk:hover{border-color:var(--sage)}
.ttl{flex:1;min-width:0;transition:color .3s}
.task.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.due{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border-radius:5px;padding:2px 7px;white-space:nowrap}
.due2{display:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);text-decoration:none}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px;opacity:.5}
.x:hover{opacity:1;color:var(--rose);background:var(--rose-soft)}

/* ---------- guests ---------- */
.gsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.glist{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grow{display:grid;grid-template-columns:minmax(0,1.6fr) auto 56px 110px minmax(0,1.2fr) 32px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow.hdr{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.grow .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.grow input.diet{border:1px solid transparent;background:none;border-radius:8px;padding:5px 8px;width:100%;min-width:0}
.grow input.diet:hover,.grow input.diet:focus{border-color:var(--line);background:var(--bg)}
.grow .n{font-variant-numeric:tabular-nums;text-align:center}
.rsvp{border:0;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;width:100%}
.rsvp.pending{background:var(--gold-soft);color:var(--gold)}
.rsvp.yes{background:var(--sage-soft);color:var(--sage)}
.rsvp.no{background:var(--line);color:var(--muted)}
.ex{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}

/* ---------- vendors ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.lane{background:color-mix(in srgb,var(--paper) 60%,var(--bg));border:1px solid var(--line);border-radius:16px;padding:10px;min-height:160px}
.lane h4{margin:2px 4px 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.lane.booked{border-color:var(--sage);background:var(--sage-soft)}
.vcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);animation:fade .35s ease}
.vcard .cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.vcard .vn{font-weight:600;overflow-wrap:anywhere}
.vcard .vc{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.vcard .vp{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.vcard .mv{display:flex;gap:4px;margin-top:8px;align-items:center}
.vcard .mv button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 9px}
.vcard .mv button:disabled{opacity:.3;cursor:default}
.vcard .mv .x{margin-left:auto}

/* ---------- ideas ---------- */
.typet{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.typet button{border:0;background:var(--bg);padding:8px 12px;font-size:13.5px}
.typet button[aria-pressed="true"]{background:var(--rose);color:var(--paper)}
.add textarea{resize:vertical;min-height:42px}
.wall{columns:3 260px;column-gap:14px}
.idea{break-inside:avoid;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);animation:fade .4s ease;position:relative}
.idea.q{background:var(--rose-soft);border-color:color-mix(in srgb,var(--rose) 30%,var(--line))}
.idea .ih{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.idea .ih .kind{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--rose)}
.idea .ih .x{margin-left:auto}
.idea p{margin:8px 0 6px;font-size:15.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.idea a{color:var(--rose);font-size:13px;overflow-wrap:anywhere}
.ans{border-top:1px solid color-mix(in srgb,var(--rose) 25%,var(--line));margin-top:8px;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.ans .a{display:flex;gap:8px;font-size:14px;align-items:flex-start}
.ans .a span{overflow-wrap:anywhere;min-width:0}
.ans form{display:flex;gap:6px}
.ans input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 9px}
.ans button{border:0;background:var(--rose);color:var(--paper);border-radius:8px;padding:6px 12px;font-weight:600}
.heart{border:0;background:none;display:inline-flex;align-items:center;gap:4px;color:var(--muted);padding:2px 6px;border-radius:8px;font-size:13px}
.heart svg{width:18px;height:18px}
.heart svg path{fill:none;stroke:currentColor;stroke-width:1.8;transition:fill .2s}
.heart.on{color:var(--rose)}
.heart.on svg path{fill:var(--rose);stroke:var(--rose)}
.heart.on svg{animation:pop .4s ease}
@keyframes pop{50%{transform:scale(1.35)}}

/* ---------- the day ---------- */
.timeline{position:relative;padding-left:96px}
.timeline::before{content:"";position:absolute;left:78px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--rose),var(--sage))}
.ev{position:relative;padding:8px 0 18px;display:flex;align-items:flex-start;gap:10px;animation:fade .4s ease}
.ev .t{position:absolute;left:-96px;width:66px;text-align:right;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;top:6px}
.ev::before{content:"";position:absolute;left:-23px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--rose)}
.ev .tx{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;overflow-wrap:anywhere}

/* ---------- settings sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,8,18,.45);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .25s ease}
.sheet{background:var(--paper);border-radius:20px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h2{font-size:26px;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select{color:var(--ink);font-size:15px;width:100%}
.dateRow{display:flex;gap:8px}
.dateRow>*{flex:1 1 0;min-width:0}
.dateRow select{flex:1.4 1 0}
.person{grid-column:1/-1;font-weight:600;color:var(--ink);font-size:14px;margin-top:6px;display:flex;align-items:center;gap:8px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.danger{border:0;background:none;color:var(--rose);margin-right:auto;padding:6px 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;z-index:70;opacity:0;transition:all .35s cubic-bezier(.2,.7,.2,1);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:65}
footer{color:var(--muted);font-size:13px;text-align:center;padding-bottom:40px}
footer .s{font-family:var(--script);font-size:26px;color:var(--rose);display:block}
.footph{position:relative;min-height:280px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));color:var(--on-photo)}
.footph .fbg{position:absolute;inset:0;background:linear-gradient(var(--bg) 0%,rgba(28,12,40,.08) 42%,rgba(28,12,40,.4) 100%),url(photos/atardecer-canoa.jpg) center 62%/cover}
.footph .fin{position:relative;text-align:center;text-shadow:0 1px 12px rgba(30,10,40,.6);padding-inline:16px}
.footph .s{color:var(--on-photo);font-size:44px;line-height:1.1}
.slide{transform:scale(1.02)}
@media (max-width:760px){.story{grid-template-columns:minmax(0,1fr)}.pols{gap:12px}.pol .cap{font-size:20px}}

@media (max-width:760px){
  .bridge{grid-template-columns:1fr 1fr;row-gap:10px}
  .arcbox{grid-column:1/-1;order:-1}
  .stats,.gsum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
  .grow{grid-template-columns:minmax(0,1fr) auto 32px;row-gap:6px}
  .grow.hdr{display:none}
  .grow .side,.grow .n{display:none}
  .grow .rsvpc{grid-column:2}
  .grow input.diet{grid-column:1/-1;grid-row:2;border-color:var(--line)}
  .grow .x{grid-row:1;grid-column:3}
  .fgrid{grid-template-columns:1fr}
  .task .due{display:none}
  .due2{display:block;margin-top:2px}
  .timeline{padding-left:76px}
  .timeline::before{left:60px}
  .ev .t{left:-76px;width:52px;font-size:16px}
  .ev::before{left:-21px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="hero">
  <div class="cover">
    <div class="slides" aria-hidden="true">
      <div class="slide on" style="background-image:url(photos/atardecer-rosa.jpg)"></div>
      <div class="slide" style="background-image:url(photos/atardecer-canoa.jpg)"></div>
      <div class="slide" style="background-image:url(photos/atardecer-lila.jpg)"></div>
    </div>
    <div class="shade" aria-hidden="true"></div>
    <canvas id="petals" aria-hidden="true"></canvas>
    <div class="wrap cover-in">
      <div class="top">
        <button class="chip btn" id="meBtn" type="button"></button>
        <span class="chip sync" id="sync"><i></i><span></span></span>
        <button class="chip btn" id="langBtn" type="button">FR · ES · EN</button>
        <button class="chip btn" id="setBtn" type="button" data-i18n="settings"></button>

function normalize(s){
  const d=seed();
  if(!s||typeof s!=="object")return d;
  const o=Object.assign({},d,s);
  o.settings=Object.assign({},d.settings,s.settings||{});
  o.settings.a=Object.assign({},d.settings.a,(s.settings||{}).a||{});
  o.settings.b=Object.assign({},d.settings.b,(s.settings||{}).b||{});
  ["tasks","guests","vendors","ideas","day","log","notes"].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  o.hugs=Object.assign({a:0,b:0,last:null},s.hugs||{});
  o.tasks.forEach(x=>{if(x.t&&typeof x.t==="object"&&!x.t.fr&&FR_T[x.t.es])x.t.fr=FR_T[x.t.es]});
  if((s.v||1)<3){
    if(!o.settings.when)o.settings.when=d.settings.when;
    o.tasks.forEach(x=>{if(typeof x.t==="object"&&x.due>9)x.due=9});
    o.guests.forEach(g=>{if(g.ex&&g.name==="Cousins de La Paz"){g.name="Famille de Grover";g.side="a"}});
    if(!o.notes.length)o.notes=d.notes;
  }
  if((s.v||1)<2){["guests","vendors","ideas","day"].forEach(k=>{if(o[k].some(i=>i.ex))o[k]=[...o[k].filter(i=>!i.ex),...d[k]]});o.v=2}
  o.v=Math.max(o.v||1,3);
  if((s.v||1)<4)patch4(o);
  if(!Array.isArray(o.map))o.map=[];if(!Array.isArray(o.prio))o.prio=[];
  return o;
}

(function petals(){
  if(reduce)return;
  const c=$("petals"),x=c.getContext("2d");let W,H,P=[];
  function size(){const r=c.getBoundingClientRect();W=c.width=r.width*devicePixelRatio;H=c.height=r.height*devicePixelRatio}
  size();addEventListener("resize",size);
  const N=Math.round(Math.min(22,W/(60*devicePixelRatio)));
  for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:(5+Math.random()*6)*devicePixelRatio,vy:(.25+Math.random()*.45)*devicePixelRatio,a:Math.random()*6.28,va:(Math.random()-.5)*.02,sw:Math.random()*6.28});
  const col=getComputedStyle(document.documentElement).getPropertyValue("--blush").trim()||"#ffc9da";
  function f(){
    if(document.hidden){requestAnimationFrame(f);return}
    x.clearRect(0,0,W,H);
    P.forEach(p=>{p.y+=p.vy;p.sw+=.012;p.x+=Math.sin(p.sw)*.5*devicePixelRatio;p.a+=p.va;if(p.y>H+20){p.y=-20;p.x=Math.random()*W}
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=.42;x.fillStyle=col;x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,6.283);x.fill();x.restore()});
    requestAnimationFrame(f)}
  requestAnimationFrame(f);
})();

function burst(cx,cy,n=36){
  if(reduce)return;
  const c=$("fx"),x=c.getContext("2d");const dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  const cs=getComputedStyle(document.documentElement);const cols=["--rose","--sage","--gold"].map(v=>cs.getPropertyValue(v).trim());
  const parts=Array.from({length:n},()=>{const a=Math.random()*6.283,s=2+Math.random()*5;return{x:cx*dpr,y:cy*dpr,vx:Math.cos(a)*s*dpr,vy:(Math.sin(a)*s-3)*dpr,r:(3+Math.random()*4)*dpr,c:cols[Math.floor(Math.random()*3)],h:Math.random()<.35,l:1}});
  function heart(x2,r){x2.beginPath();x2.moveTo(0,r*.3);x2.bezierCurveTo(-r,-r*.4,-r*.6,-r,0,-r*.4);x2.bezierCurveTo(r*.6,-r,r,-r*.4,0,r*.3);x2.fill()}
  function f(){x.clearRect(0,0,c.width,c.height);let alive=false;
    parts.forEach(p=>{p.vy+=.18*dpr;p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.l-=.016;if(p.l>0){alive=true;x.save();x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.translate(p.x,p.y);
      if(p.h){x.scale(1.4,1.4);heart(x,p.r)}else{x.beginPath();x.arc(0,0,p.r*.6,0,6.283);x.fill()}x.restore()}});
    if(alive)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)}
  requestAnimationFrame(f);
}

$("ideaType").onclick=e=>{const b=e.target.closest("[data-k]");if(b){ui.ideaK=b.dataset.k;renderIdeas()}};
$("taskForm").onsubmit=e=>{e.preventDefault();const v=$("taskText").value.trim();if(!v)return;S.tasks.push({id:uid(),cat:$("taskCat").value,t:v,due:1,who:$("taskWho").value,done:false});$("taskText").value="";commit()};
$("guestForm").onsubmit=e=>{e.preventDefault();const v=$("gName").value.trim();if(!v)return;S.guests.push({id:uid(),name:v,side:$("gSide").value,n:Math.max(1,parseInt($("gN").value,10)||1),rsvp:"pending",diet:""});log("guest",v);$("gName").value="";$("gN").value=1;commit()};
$("vendorForm").onsubmit=e=>{e.preventDefault();const v=$("vName").value.trim();if(!v)return;S.vendors.push({id:uid(),cat:$("vCat").value,name:v,contact:$("vContact").value.trim(),price:parseFloat($("vPrice").value)||0,st:0});["vName","vContact","vPrice"].forEach(i=>$(i).value="");commit()};
$("ideaForm").onsubmit=e=>{e.preventDefault();const v=$("ideaText").value.trim();if(!v)return;S.ideas.push({id:uid(),k:ui.ideaK,by:me,text:v,link:$("ideaLink").value.trim(),ts:Date.now(),hearts:[],ans:[]});log(ui.ideaK==="q"?"q":"idea");$("ideaText").value="";$("ideaLink").value="";commit()};
$("dayForm").onsubmit=e=>{e.preventDefault();const tm=$("dTime").value,v=$("dText").value.trim();if(!tm||!v)return;S.day.push({id:uid(),time:tm,text:v});$("dText").value="";commit()};

/* settings sheet */
$("setBtn").onclick=openSettings;
function openSettings(){
  const s=S.settings;
  $("sheetRoot").innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="setForm" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">${t("settings")}</h2>
    <div class="fgrid">
      <label class="field">${av("a")} ${t("nameA")}<input id="sNa" value="${esc(s.a.name)}" required></label>
      <label class="field">${av("b")} ${t("nameB")}<input id="sNb" value="${esc(s.b.name)}" required></label>
      <label class="field" style="grid-column:1/-1">${t("whenL")}<input id="sW" value="${esc(s.when||"")}" placeholder="${esc(t("whenPh"))}"></label>
      <label class="field" style="grid-column:1/-1">${t("place")}<input id="sP" value="${esc(s.place||"")}"></label>
    </div>
    <div class="acts"><button type="button" class="danger" id="sReset">${t("reset")}</button><span id="sConfirm" hidden>${t("resetQ")} <button type="button" class="ghost" id="sYes">${t("resetYes")}</button></span>
      <button type="button" class="ghost" id="sClose">${t("close")}</button><button class="primary">${t("save")}</button></div>
  </form></div>`;
  const close=()=>{$("sheetRoot").innerHTML="";$("setBtn").focus()};
  $("sNa").focus();
  $("scrim").onclick=e=>{if(e.target.id==="scrim")close()};
  $("sClose").onclick=close;
  $("scrim").onkeydown=e=>{if(e.key==="Escape")close()};
  $("sReset").onclick=()=>{$("sConfirm").hidden=false};
  $("sYes").onclick=()=>{const keep=S.settings;S=seed();S.settings=keep;["guests","vendors","ideas","day"].forEach(k=>S[k]=[]);close();commit()};
  $("setForm").onsubmit=e=>{e.preventDefault();
    S.settings=Object.assign({},S.settings,{a:Object.assign({},S.settings.a,{name:$("sNa").value.trim()||"A"}),b:Object.assign({},S.settings.b,{name:$("sNb").value.trim()||"B"}),when:$("sW").value.trim(),place:$("sP").value.trim()});
    close();commit();toast(t("saved"))};
}

/* =========================================================
   9. CLOUD SYNC (optional, Firebase)
   ========================================================= */
let syncState="local";
function setSync(st){syncState=st;const el=$("sync");el.className="chip sync"+(st==="on"?" on":st==="err"||st==="login"?" warn":"");
  el.querySelector("span").textContent=t({local:"syncLocal",on:"syncOn",login:"syncLogin",err:"syncErr"}[st]);
  el.classList.toggle("btn",st==="login");el.onclick=st==="login"?()=>cloud&&cloud.signIn():null;el.style.cursor=st==="login"?"pointer":""}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initCloud(){
  if(!FIREBASE_CONFIG){setSync("local");return}
  try{
    const v="10.12.2",base=`https://www.gstatic.com/firebasejs/${v}/`;
    await loadScript(base+"firebase-app-compat.js");
    await Promise.all([loadScript(base+"firebase-auth-compat.js"),loadScript(base+"firebase-firestore-compat.js")]);
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth(),db=firebase.firestore();
    cloud={signIn:()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(()=>setSync("err"))};
    auth.onAuthStateChanged(u=>{
      if(!u){cloud.ref=null;setSync("login");return}
      cloud.ref=db.doc(FIREBASE_DOC);
      if(!cloud.ping){
        const pref=w=>db.doc(`weddings/presence-${w}`);
        cloud.ping=(extra={})=>pref(me).set(Object.assign({seen:Date.now(),away:document.hidden},extra),{merge:true}).catch(()=>{});
        cloud.swap=old=>{pref(old).set({away:true,seen:Date.now()},{merge:true}).catch(()=>{});cloud.ping()};
        cloud.ping();setInterval(()=>{if(!document.hidden)cloud.ping()},30000);
        document.addEventListener("visibilitychange",()=>cloud.ping());
        addEventListener("pagehide",()=>cloud.ping({away:true}));
        ["a","b"].forEach(w=>pref(w).onSnapshot(sn=>{const d=sn.exists?sn.data():null;PRES[w]=d;
          if(d&&w!==me&&d.hugAt){const seen=+ls.get("ow-hugseen-"+w)||0;if(d.hugAt>seen){ls.set("ow-hugseen-"+w,d.hugAt);if(Date.now()-d.hugAt<864e5)showHugFrom(w)}}
          renderPresence()},()=>{}));
        renderPresence();
      }
      cloud.ref.onSnapshot(snap=>{
        if(snap.metadata.hasPendingWrites)return;
        if(!snap.exists){save();setSync("on");return}
        const prevHug=S.hugs.last;
        S=normalize(snap.data().state);ls.set(KEY,JSON.stringify(S));softRender();setSync("on");
        const h=S.hugs.last;const seen=+ls.get("ow-hugseen")||0;
        
      },()=>setSync("err"));
    });
  }catch(err){setSync("err")}
}

/* =========================================================
   9b. PHOTOS: sunset slideshow + lightbox
   ========================================================= */
(function slideshow(){
  const s=[...document.querySelectorAll(".slide")];if(reduce||s.length<2)return;let i=0;
  setInterval(()=>{if(document.hidden)return;s[i].classList.remove("on");i=(i+1)%s.length;s[i].classList.add("on")},8000);
})();
const PHOTOS=[["propuesta","cap0"],["selfie","cap1"],["dijo-que-si","cap2"],["atardecer-rosa","cap3"],["atardecer-canoa","cap3"],["atardecer-lila","cap3"]];
let lbI=-1,lbFrom=null;
function showLB(i){
  lbI=(i+PHOTOS.length)%PHOTOS.length;const [f,c]=PHOTOS[lbI];
  $("lbRoot").innerHTML=`<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="${esc(t(c))}">
    <img src="photos/${f}.jpg" alt="${esc(t(c))}"><div class="lbc">${esc(t(c))}</div>
    <button class="lbp" type="button" aria-label="${esc(t("prev"))}">‹</button><button class="lbn" type="button" aria-label="${esc(t("next"))}">›</button><button class="lbx" type="button" aria-label="${esc(t("close"))}">×</button></div>`;
  const lb=$("lb");lb.querySelector(".lbx").focus();
  lb.onclick=e=>{if(e.target===lb||e.target.closest(".lbx"))closeLB();else if(e.target.closest(".lbp"))showLB(lbI-1);else if(e.target.closest(".lbn"))showLB(lbI+1)};
}
function closeLB(){$("lbRoot").innerHTML="";lbI=-1;if(lbFrom)lbFrom.focus()}
document.addEventListener("click",e=>{const p=e.target.closest("[data-photo]");if(!p)return;lbFrom=p;showLB(+p.dataset.photo)});
document.addEventListener("keydown",e=>{if(lbI<0)return;if(e.key==="Escape")closeLB();else if(e.key==="ArrowLeft")showLB(lbI-1);else if(e.key==="ArrowRight")showLB(lbI+1)});
let tx=null;document.addEventListener("touchstart",e=>{if(lbI>=0)tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(lbI<0||tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)showLB(lbI+(dx<0?1:-1));tx=null});

   10. START
   ========================================================= */
renderAll();
setInterval(softRender,60000);
initCloud();
